# タスクの仕様：買取表のカード同定（ADR-0030）
#
# 何を求めるかだけを書く。モデルにどう伝えるかは、被験ハーネスのプロンプトが受け持つ。
# 値の一覧（status、仕様の軸の値など）は、出力のスキーマだけが持つ。ここでは参照する。
# 決まりの番号（R-NN）は、一度付けたら変えない。決まりをやめるときは、番号を欠番にする。
# 読み手は、人と被験ハーネス。モデルには渡さない（ADR-0032）。モデルへの作業指示は、被験ハーネスの prompt.md が持つ。
# 決まりの本文（text、examples）は、プロンプトに書き直しやすいよう、参照なしで読めるように書く。see は人のための出典。

id: buylist-card-id
version: 1
summary: 買取表の画像1枚から、掲載されているカードを1枚ずつ読み取り、どのカードかを特定する。

input:
  - name: image
    description: 買取表の画像1枚。カードの画像と買取価格が、格子状に並んでいる。
  - name: meta
    description: 任意。店舗名、更新日。
    required: false

output:
  schema: schemas/output.schema.json
  example: schemas/examples/output.example.json
  description: 掲載カードの一覧（JSON）。1枚のカードにつき、位置・印刷内容・価格・特定の結果を1つ出す。
  values:                          # 値の一覧の場所（中身はスキーマだけが持つ）
    status: schemas/output.schema.json#/$defs/status
    edition: schemas/output.schema.json#/$defs/edition
    finish: schemas/output.schema.json#/$defs/finish
    stamp: schemas/output.schema.json#/$defs/stamp

rules:
  # 位置
  - id: R-01
    topic: 位置
    text: 位置は、上から1始まりの段（row）、左から1始まりの列（col）で数える。
  - id: R-02
    topic: 位置
    text: 格子の段の数と列の数（grid）を出す。カードのないマスは、カードの一覧に含めない。

  # 読み取り
  - id: R-03
    topic: 読み取り
    text: 価格は、画像に書かれている通りの文字（price_text）と、それを円の整数にしたもの（price_jpy）の両方を出す。価格が書かれていない、または読み取れないときは、どちらも null にする。
    examples:
      - {printed: "¥1,800,000", price_text: "¥1,800,000", price_jpy: 1800000}
      - {printed: "1.5万円", price_text: "1.5万円", price_jpy: 15000}
      - {printed: "17万円", price_text: "17万円", price_jpy: 170000}
    see: [ADR-0040]
  - id: R-04
    topic: 読み取り
    text: カード名は、画像に印刷されている通りに出す。知識で補わない。
    examples:
      - {printed: "ギラティナ", output: "ギラティナ", note: "画像にEXの表記がなければ、EXを付けない"}
  - id: R-05
    topic: 読み取り
    text: HPとワザ名は、画像から読み取れる範囲で出す。読み取れないものは出さない。

  # 特定
  - id: R-06
    topic: 特定
    text: カードを特定したら、収録パック・カード番号・仕様を出す。
    see: [ADR-0026]
  - id: R-07
    topic: 特定
    text: カード番号は、カードに印刷されている通りに、分母やプロモの記号も含めて出す。
    examples:
      - {output: "055/053"}
      - {output: "001/BW-P"}
  - id: R-08
    topic: 特定
    text: 収録パックは、商品の名前で出す。型番（BW1など）ではない。
    examples:
      - {output: "プラズマゲイル"}
    see: [ADR-0029]
  - id: R-09
    topic: 特定
    text: 仕様は、版・加工・スタンプの軸ごとに、決められた値の中から選んで出す。版と加工は、画像で確かめられなければ「指定なし」にする。加工がノーマルではないとわかるが、種類が値の中にない、または見分けられなければ「その他の加工」にする。スタンプ（配布元のロゴなどが、カードの絵の上に押されたもの）は、画像に見当たらなければ「なし」、押されているとわかるが、どのスタンプか値の中にない、または見分けられなければ「その他のスタンプ」、画像が粗くて見分けられなければ「指定なし」にする。推測で埋めない。
    examples:
      - {image: "1EDのマークが小さくて読めない", edition: 指定なし}
      - {image: "絵の上にスタンプが見当たらない", stamp: なし}
    see: [ADR-0027, ADR-0036, ADR-0043]

  # 不明
  - id: R-10
    topic: 不明
    text: 確信が持てなければ、無理に特定せず、status を unknown にしてよい。間違ったカードを答えるより、不明と答える方がよい。
    see: [設計書 2.3]
  - id: R-11
    topic: 不明
    text: 不明の場合は、候補（candidates）を出してよい。

  # 道具
  - id: R-12
    topic: 道具
    text: 与えられた画像と、使ってよいと渡された道具だけを使う。

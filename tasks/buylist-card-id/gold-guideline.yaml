# 正解データ（gold.csv）の作り方（ADR-0031：人が読み書きするものは YAML）
#
# 何を書くか（列・型・必須か）は schemas/gold.schema.yaml が決める。
# ここでは、どうやって書くか（手順、確かめ方、迷ったときの決まり）を決める。
# 番号（S-NN、G-NN）は、一度付けたら変えない。やめるときは欠番にする。
# gold.csv の note には、値を決めた根拠として決まりの番号を書いてよい（例：G-10により指定なし）。
#
# 【注意】このファイルは、被験エージェントには渡さない。正解の作り方が漏れると、評価が成り立たなくなる。
#
# 決まりの本文（text、examples）は、それだけで読めるように書く（ADR-0032）。
# see は、人がなぜそう決めたかをたどるための出典。LLMには渡さない。
#
# 手順（steps）は、人の作業の流れ。決まり（rules）には、次の欄を付ける。
# for：誰に渡す決まりか。
#   draft：下書きを作るLLM（S-03）にも渡す。渡すのは text・examples・why だけ
#   verify：下書きを確かめる人が使う
# check：その決まりを機械で確かめられるか。
#   machine：確認の道具で確かめられる（道具はまだない）
#   human：人が確かめる

id: buylist-card-id
version: 1

# 作業の流れ（設計書 10.1）
steps:
  - id: S-01
    text: 買取表の画像を選ぶ。パックごとの番号が印刷されたカードが中心のものにする。
    see: [G-14, ADR-0028]
  - id: S-02
    text: samples/<サンプルのID>/ を作り、meta.yaml に出典・店舗・更新日・収集日・段と列・枚数・世代を書く。gold_version は 1 から始める。
    see: [設計書 5.1]
  - id: S-03
    text: 強いモデルで gold.csv の下書きを作る。使ったモデルを meta.yaml に記録する。
    see: [G-15, G-16]
  - id: S-04
    text: 全行について、画像の印刷内容（カード名・HP・価格）を確かめる。
    see: [G-01, G-02, G-03, G-04]
  - id: S-05
    text: 全行について、パック・番号・仕様を、2つ以上の照合先で突き合わせて確かめる。
    see: [G-05, G-06, G-07, G-08, G-09, G-10, G-11, G-12]
  - id: S-06
    text: 対象外のカードと、特定を確定できないカードを gold.csv から外し、meta.yaml に記録する。
    see: [G-08, G-14]
  - id: S-07
    text: verified_by・verified_at・sources を埋めて確定する。
    see: [G-13]
  - id: S-08
    text: gold.csv が schemas/gold.schema.yaml と、仕様の値の一覧（output.schema.json）に合っているかを確かめる。
    see: [G-17]
  - id: S-09
    text: 確定したあとで直したら、gold_version を上げ、何を直したかを meta.yaml に記録する。
    see: [G-18]

rules:
  # 位置
  - id: G-01
    topic: 位置
    for: [draft, verify]
    text: 段（row）は上から1始まり、列（col）は左から1始まりで数える。カードのないマス（空きや広告など）は行にしない。
    why: 採点では、まず位置で出力と正解を対応付けるため。
    see: [spec.yaml R-01, spec.yaml R-02, 設計書 8.1]
    check: human

  # 読み取り
  - id: G-02
    topic: 読み取り
    for: [draft, verify]
    text: カード名（name）は、画像に印刷されている通りに書く。知識で補わない。
    examples:
      - {printed: "ギラティナ", gold: "ギラティナ", note: "画像にEXの表記がなければ、EXを付けない"}
    why: 知識による補完を正解にすると、補完した出力が正解になり、画像を読めていないことに気づけないため。
    see: [spec.yaml R-04, 設計書 9.2]
    check: human
  - id: G-03
    topic: 読み取り
    for: [draft, verify]
    text: HP（hp）は、画像に印刷されている通りに書く。画像で読めなければ空にする。カードの知識で埋めない。
    why: HPは、読み取りの精度を見るための列。画像で読めない値を正解にすると、モデルにも読めない値を求めることになるため。
    check: human
  - id: G-04
    topic: 読み取り
    for: [draft, verify]
    text: 価格（price_jpy）は、画像に書かれている買取価格を、円の整数で書く。価格が書かれていなければ空にする。
    examples:
      - {printed: "¥1,800,000", gold: 1800000}
    see: [spec.yaml R-03]
    check: human

  # 特定
  - id: G-05
    topic: 特定
    for: [draft, verify]
    text: パック（pack）は、公式の商品名から、シリーズの名前・商品の種類・かぎかっこを外した名前で書く。プロモは「BWプロモ」のように、世代の名前に「プロモ」を付ける。
    examples:
      - {official: "ポケモンカードゲームBW 拡張パック「ブラックコレクション」", gold: "ブラックコレクション"}
    why: 書き方のゆれで、合っているのに誤答になるのを防ぐため。
    see: [ADR-0029]
    check: human
  - id: G-06
    topic: 特定
    for: [draft, verify]
    text: 番号（number）は、カードに印刷されている通りに、分母やプロモの記号も含めて書く。
    examples:
      - {gold: "055/053"}
      - {gold: "001/BW-P"}
    why: 分母やプロモの記号を落とすと、別のパックのカードと取り違えるため。
    see: [ADR-0026, spec.yaml R-07]
    check: machine
  - id: G-07
    topic: 特定
    for: [verify]
    text: パック・番号は、2つ以上の照合先で突き合わせて確かめ、使った照合先を sources に「;」で区切って書く。照合先は、公式のカード検索、ショップ（遊々亭、カードラッシュなど）、ポケモンカードWiki など。
    why: 照合先ごとに、載っていないカードや誤りがある（公式にはBW期のシークレットレアがない、など）。1つだけでは抜けや誤りに気づけないため。
    see: [ADR-0026, docs/research/card-data-sources.md]
    check: machine
  - id: G-08
    topic: 特定
    for: [verify]
    text: 照合先の間で食い違ったら、画像に印刷されている内容（HP、ワザ、レアリティのマーク、番号）と突き合わせて決める。それでも決められなければ、そのカードを gold.csv から外す（G-14）。
    why: 正解データは物差しなので、確かでない値を入れないため。
    check: human
  - id: G-09
    topic: 特定
    for: [draft, verify]
    text: 同じ名前のカード（レシラム3種など）と、型番と番号が重なるカード（BW1の055/053など）は、HP・ワザ・レアリティで、どのパックのカードかを特に確かめる。
    why: モデルが取り違えやすく、正解データの側でも取り違えやすいため。
    see: [設計書 2.2]
    check: human

  # 仕様
  - id: G-10
    topic: 仕様
    for: [draft, verify]
    text: 版（edition）・加工（finish）・スタンプ（stamp）は、買取表や画像で確かめられた軸だけを書く。確かめられない軸は「指定なし」にする。推測で埋めない。
    why: 推測を正解にすると、モデルが正しく「わからない」と答えても誤答になるため。
    see: [ADR-0027]
    check: human
  - id: G-11
    topic: 仕様
    for: [draft, verify]
    text: 「なし」と「指定なし」を使い分ける。「なし」は確かめた結果その軸の仕様がないとき（1EDのない世代、スタンプが押されていない）、「指定なし」は確かめられないとき。
    why: カードDBに移すとき、「なし」は1つのカードに決まるが、「指定なし」は候補が複数残るため。
    see: [ADR-0027]
    check: human
  - id: G-12
    topic: 仕様
    for: [verify]
    text: 値の一覧にない加工やスタンプ（マスターボールミラーなど）が出てきたら、先に出力のスキーマ（output.schema.json）の値の一覧に足してから書く。加工は、ミラーの種類の名前まで分ける。
    why: 値の一覧は output.schema.json だけが持つため（ADR-0030）。
    see: [ADR-0027, ADR-0030]
    check: machine

  # 記録
  - id: G-13
    topic: 記録
    for: [verify]
    text: 全行に verified_by（確認した人）と verified_at（確認した日）を書く。人が確かめていない行を残さない。
    why: 下書きの誤りが、そのまま正解データに残るのを防ぐため（設計書 10.2）。
    check: machine

  # 対象外
  - id: G-14
    topic: 対象外
    for: [verify]
    text: パックごとの番号が印刷されていないカード（旧裏・neo、DP1〜DP5、番号のないプロモ）と、G-08 で特定を確定できなかったカードは、gold.csv に入れない。外したカードの位置・カード名・理由を meta.yaml に記録する。
    why: 仮のキーで表せないカードや、確かでないカードで採点しないため。外したことを記録して、成績の母数が変わったことを追えるようにする。
    see: [ADR-0028]
    check: human

  # 下書き
  - id: G-15
    topic: 下書き
    for: [verify]
    text: モデルの下書きをそのまま正解にしない。下書きは、人が確かめる作業を速くするためだけに使う。
    why: 正解データはモデルの成績を測る物差しで、モデルの出力をそのまま物差しにすると、測る意味がなくなるため（設計書 10.2）。
    check: human
  - id: G-16
    topic: 下書き
    for: [verify]
    text: 下書きに使ったモデル（名前と版）を、meta.yaml に記録する。
    why: Claude は被験モデルでもある。下書きに使ったモデルに有利な偏りが入っていないかを、あとで確かめられるようにするため（設計書 10.2）。
    check: machine

  # 確認
  - id: G-17
    topic: 確認
    for: [verify]
    text: 確定する前に、gold.csv が gold.schema.yaml（列・型・必須）と、output.schema.json の値の一覧（仕様の軸）に合っているかを確かめる。
    why: 採点器は、合っていない gold.csv では採点を止めるため（ADR-0019）。
    check: machine

  # 修正
  - id: G-18
    topic: 修正
    for: [verify]
    text: 確定したあとで gold.csv を直したら、meta.yaml の gold_version を1つ上げ、何を直したかを記録する。
    why: 直す前と後の採点の結果を、取り違えて比べないようにするため（設計書 10.2）。
    check: human
